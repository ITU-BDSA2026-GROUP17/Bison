name: .NET Stryker

on: workflow_dispatch

env:
    DOTNET_VERSION: "8.0.x"

jobs:
    coverage-report:
        name: stryker
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore Local Tools
              run: dotnet tool restore

            - name: Install Dependencies
              run: dotnet restore

            - name: Build
              run: dotnet build --no-restore

            - name: Ensure browsers are installed
              run: pwsh test/Bison.Razor.Tests/bin/Debug/net8.0/playwright.ps1 install --with-deps

            - name: Test
              run: dotnet test && make coverage-report
              env:
                  authentication__github__clientId: ${{ secrets.AUTHENTICATION__GITHUB__CLIENTID }}
                  authentication__github__clientSecret: ${{ secrets.AUTHENTICATION__GITHUB__CLIENTSECRET }}

            - name: Zip results
              run: zip -j coverage-report.zip coverage-report/*

            - name: Save Coverlet Coverage Result
              uses: actions/upload-artifact@v7
              with:
                  name: "coverlet-coverage-report"
                  path: coverage-report.zip
                  retention-days: 7
    stryker:
        name: stryker
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore Local Tools
              run: dotnet tool restore

            - name: Install Dependencies
              run: dotnet restore

            - name: Build
              run: dotnet build --no-restore

            - name: Ensure browsers are installed
              run: pwsh test/Bison.Razor.Tests/bin/Debug/net8.0/playwright.ps1 install --with-deps

            - name: Test
              run: dotnet tool run stryker
              env:
                  authentication__github__clientId: ${{ secrets.AUTHENTICATION__GITHUB__CLIENTID }}
                  authentication__github__clientSecret: ${{ secrets.AUTHENTICATION__GITHUB__CLIENTSECRET }}

            - name: Save Stryker Result
              uses: actions/upload-artifact@v7
              with:
                  name: "stryker-report"
                  path: StrykerOutput/*/reports/*.html
                  retention-days: 7
                  
