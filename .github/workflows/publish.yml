name: .NET Publish

permissions:
    contents: write

on:
    push:
        tags:
            - "v*.*.*"

env:
    DOTNET_VERSION: "8.0.x"

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Install Dependencies
              run: dotnet restore

            - name: Build
              run: dotnet build --no-restore

            - name: Test
              run: dotnet test --no-build --verbosity normal

            - name: Publish and Zip
              run: |
                  make all
                  rm -rf data/*.zip
                  zip -j data/bison-linux-x64.zip bin/Release/net8.0/linux-x64/publish/Bison
                  zip -j data/bison-linux-arm64.zip bin/Release/net8.0/linux-arm64/publish/Bison
                  zip -j data/bison-osx-x64.zip bin/Release/net8.0/osx-x64/publish/Bison
                  zip -j data/bison-osx-arm64.zip bin/Release/net8.0/osx-arm64/publish/Bison
                  zip -j data/bison-win-x64.zip bin/Release/net8.0/win-x64/publish/Bison.exe
                  zip -j data/bison-win-arm64.zip bin/Release/net8.0/win-arm64/publish/Bison.exe
              env:
                  BISON_VERSION: ${{ github.ref_name }}

            - name: Release on GitHub
              uses: softprops/action-gh-release@v3
              with:
                  generate_release_notes: true
                  files: |
                      data/*.zip
