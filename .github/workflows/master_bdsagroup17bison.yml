# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - bdsagroup17bison

on:
    push:
        branches:
            - "master"
    workflow_dispatch:

env:
    DOTNET_VERSION: "8.0.x"

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            id-token: write #This is required for requesting the JWT
            contents: read #This is required for actions/checkout

        steps:
            - uses: actions/checkout@v7
            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Setup Z3
              id: z3
              uses: cda-tum/setup-z3@v1.7.3
              with:
                  add_to_library_path: true

            - name: Install Dependencies
              run: dotnet restore

            - name: Install Tools
              run: dotnet tool restore

            - name: Build Dafny
              run: make dafny

            - name: Build with dotnet
              run: dotnet build --configuration Release

            - name: dotnet publish
              run: dotnet publish src/Bison.Razor -c Release -o ${{env.DOTNET_ROOT}}/myapp

            - name: Upload artifact for deployment job
              uses: actions/upload-artifact@v7
              with:
                  name: .net-app
                  path: ${{env.DOTNET_ROOT}}/myapp

            - name: Login to Azure
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_984F9E14341F4A0784D6733FEF4095D2 }}
                  tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_51FE0B8E0350444D958C9A07DC0F5BFC }}
                  subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2D15BD812423467393BFADCBFCC17EE5 }}

            - name: Deploy to Azure Web App
              id: deploy-to-webapp
              uses: azure/webapps-deploy@v3
              with:
                  app-name: "bdsagroup17bison"
                  slot-name: "Production"
                  package: ${{env.DOTNET_ROOT}}/publish
